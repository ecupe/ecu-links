<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05060a">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="__DESCRIPTION__" data-i18n-content="meta.description">
  <meta property="og:title" content="__NAME__">
  <meta property="og:description" content="__DESCRIPTION__">
  <meta property="og:url" content="__SITE_URL__">
  <meta property="og:image" content="__SITE_URL__images/og-card.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <title data-i18n="meta.title">__NAME__ | Music &amp; Links</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" href="assets/fonts/sora-0.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="images/profile-320.webp" as="image" type="image/webp">
  <link rel="stylesheet" href="assets/css/site.css">
  <script>
    document.documentElement.classList.add("js");
    // Apply the saved theme before first paint so light mode never flashes dark.
    try { if (localStorage.getItem("ecu-theme") === "light") document.documentElement.dataset.theme = "light"; } catch (_) {}
    // Lite mode: drop ambient motion on low-end devices or when Data Saver is on.
    var conn = navigator.connection || {};
    if ((navigator.deviceMemory && navigator.deviceMemory <= 2) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2) || conn.saveData) {
      document.documentElement.classList.add("lite");
    }
  </script>
</head>
<body>
  <div class="intro" aria-hidden="true">
    <svg class="intro-mark" viewBox="0 0 64 64">
      <rect class="blade blade-spine" x="10" y="8" width="9" height="48" rx="4.5"/>
      <rect class="blade blade-1" x="10" y="8" width="44" height="10" rx="5"/>
      <rect class="blade blade-2" x="10" y="27" width="34" height="10" rx="5"/>
      <rect class="blade blade-3" x="10" y="46" width="44" height="10" rx="5"/>
    </svg>
    <span class="intro-word">ECU</span>
  </div>

  <div class="backdrop" aria-hidden="true">
    <div class="aurora aurora-gold"></div>
    <div class="aurora aurora-blue"></div>
    <div class="aurora aurora-red"></div>
    <div class="grid-lines"></div>
    <div class="grain"></div>
  </div>
  <canvas id="sparks" class="sparks" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand" href="#top" aria-label="__NAME__">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect class="blade blade-spine" x="10" y="8" width="9" height="48" rx="4.5"/>
        <rect class="blade blade-1" x="10" y="8" width="44" height="10" rx="5"/>
        <rect class="blade blade-2" x="10" y="27" width="34" height="10" rx="5"/>
        <rect class="blade blade-3" x="10" y="46" width="44" height="10" rx="5"/>
      </svg>
      <span class="brand-word">ECU</span>
    </a>
    <div class="topbar-actions">
    <button id="qr-open" class="icon-button" type="button" data-i18n-aria-label="qr.open" aria-label="Show QR code" data-i18n-title="qr.open" title="Show QR code">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>
    </button>
    <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch to light mode" aria-pressed="false">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <div class="language-control">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 7h14M5 17h14"/></svg>
      <label for="language-select" data-i18n="language.label">Language</label>
      <select id="language-select" name="language" data-i18n-aria-label="language.label" aria-label="Language">__LANGUAGE_OPTIONS__</select>
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
    </div>
    </div>
  </header>

  <main id="top" class="site-shell">
    <header class="hero">
      <div class="avatar" data-reveal>
        <span class="avatar-glow" aria-hidden="true"></span>
        <span class="avatar-ring" aria-hidden="true"></span>
        <picture>
          <source srcset="images/profile-320.webp 1x, images/profile-640.webp 2x" type="image/webp">
          <img class="profile-photo" src="images/profile-320.jpg" srcset="images/profile-320.jpg 1x, images/profile-640.jpg 2x" alt="__NAME__" width="148" height="148" fetchpriority="high">
        </picture>
        <span class="avatar-live" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
      <p class="eyebrow" data-reveal data-i18n="site.eyebrow">Music &amp; connections</p>
      <h1 class="hero-title" data-split>__NAME__</h1>
      <p class="hero-subtitle" data-reveal data-i18n="content.tagline">__TAGLINE__</p>
      <div class="hero-actions" data-reveal>
        <button id="hero-listen" class="cta" type="button" data-magnetic>
          <span class="cta-glow" aria-hidden="true"></span>
          <span class="cta-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <span class="cta-eq"><i></i><i></i><i></i></span>
          </span>
          <span data-i18n="hero.listen">Listen now</span>
        </button>
      </div>
      <a class="scroll-cue" href="#links" aria-hidden="true" tabindex="-1"><span></span></a>
    </header>

    <div id="links" class="sections-grid">__SECTIONS__
      <section class="link-section glass discography" data-reveal aria-labelledby="discography-heading">
        <h2 id="discography-heading" class="section-heading" data-i18n="music.heading">Discography</h2>
        <div id="discography" class="track-grid"></div>
      </section>__CONTACT__
    </div>

    <footer class="site-footer-wrap" data-reveal>
      <span class="flag-stripe" aria-hidden="true"><i></i><i></i><i></i></span>
      <p class="site-footer" data-i18n="site.footer">__NAME__ &middot; Music &amp; links</p>
      <button id="install-app" class="install-app" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>
        <span data-i18n="app.install">Install app</span>
      </button>
    </footer>
  </main>

  <p id="language-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>

  <div id="player-dock" class="player-dock">
    <section id="playlist-panel" class="playlist-panel glass" aria-labelledby="playlist-heading" hidden>
      <div class="playlist-heading">
        <h2 id="playlist-heading" data-i18n="player.queueHeading">Your next listen</h2>
        <button id="close-queue" class="close-queue" type="button" data-i18n-aria-label="player.closeQueue" aria-label="Close playlist">&times;</button>
      </div>
      <div id="playlist-items" class="playlist-items"></div>
    </section>
    <section id="music-player" class="music-player glass" data-i18n-aria-label="player.heading" aria-label="Music player">
      <div class="player-grid">
        <div class="cd" aria-hidden="true">
          <img id="cd-cover" class="cd-cover" src="__FIRST_COVER__" alt="" width="62" height="62">
        </div>
        <div class="player-info">
          <div class="player-topline">
            <p id="playing-label" class="playing-label">Ready to play</p>
            <span class="player-tools">
            <button id="share-song" class="mini-button" type="button" data-i18n-aria-label="share.player" aria-label="Share this song" data-i18n-title="share.player" title="Share this song">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
            </button>
            <button id="viz-open" class="mini-button" type="button" data-i18n-aria-label="viz.open" aria-label="Open full-screen visualizer" data-i18n-title="viz.open" title="Open full-screen visualizer">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
            </button>
            <button id="queue-toggle" class="queue-toggle" type="button" data-i18n-aria-label="player.openQueue" aria-label="Open playlist" aria-controls="playlist-panel" aria-expanded="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h11"/></svg>
              <span id="queue-count">4 songs</span>
            </button>
            </span>
          </div>
          <p id="track-title" class="track-title">__FIRST_TITLE__</p>
          <p id="track-artist" class="track-artist">__NAME__</p>
          <canvas id="waveform" class="waveform" aria-hidden="true"></canvas>
        </div>
        <div class="player-controls">
          <button id="previous-button" class="control-button" type="button" data-i18n-aria-label="player.previous" aria-label="Previous song">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h2v14H5zm14 0v14L8 12z"/></svg>
          </button>
          <button id="play-button" class="control-button play-button" type="button" aria-label="Play music" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button id="next-button" class="control-button" type="button" data-i18n-aria-label="player.next" aria-label="Next song">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5h2v14h-2zM5 5l11 7L5 19z"/></svg>
          </button>
        </div>
      </div>
      <div class="player-bottom">
        <div class="timeline">
          <span id="elapsed" class="clock">0:00</span>
          <input id="seek" class="seek" type="range" min="0" max="1000" step="1" value="0" data-i18n-aria-label="player.position" aria-label="Song position" disabled>
          <span id="duration" class="clock">0:00</span>
        </div>
        <div class="volume-controls">
          <button id="mute-button" class="mute-button" type="button" aria-label="Mute music" aria-pressed="false"></button>
          <input id="volume" class="volume" type="range" min="0" max="1" step="0.01" value="0.45" data-i18n-aria-label="player.volume" aria-label="Music volume">
        </div>
      </div>
      <p id="player-status" class="player-status" role="status" aria-live="polite"></p>
      <audio id="music-audio" preload="metadata"></audio>
    </section>
  </div>

  <dialog id="qr-dialog" class="sheet qr-sheet" aria-labelledby="qr-heading">
    <button class="sheet-close" type="button" data-close data-i18n-aria-label="qr.close" aria-label="Close">&times;</button>
    <img class="qr-image" src="images/qr.svg" alt="" width="240" height="240">
    <h2 id="qr-heading" data-i18n="qr.heading">Scan to open my page</h2>
    <p class="qr-url">__SITE_URL__</p>
    <div class="sheet-actions">
      <button id="qr-copy" class="pill" type="button" data-i18n="qr.copy">Copy link</button>
      <a class="pill" href="images/qr.svg" download="ecu-links-qr.svg" data-i18n="qr.download">Download QR</a>
    </div>
  </dialog>

  <dialog id="viz-dialog" class="viz" data-i18n-aria-label="player.heading" aria-label="Music player">
    <div class="viz-backdrop" aria-hidden="true"><img id="viz-blur" alt=""></div>
    <canvas id="viz-canvas" class="viz-canvas" aria-hidden="true"></canvas>
    <button class="sheet-close viz-close" type="button" data-close data-i18n-aria-label="viz.close" aria-label="Close visualizer">&times;</button>
    <div class="viz-center">
      <img id="viz-cover" class="viz-cover" alt="" width="320" height="320">
    </div>
    <div class="viz-info">
      <p id="viz-title" class="viz-title"></p>
      <p id="viz-artist" class="viz-artist"></p>
      <div class="viz-controls">
        <button class="control-button" type="button" data-viz="previous" data-i18n-aria-label="player.previous" aria-label="Previous song"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h2v14H5zm14 0v14L8 12z"/></svg></button>
        <button class="control-button play-button" type="button" data-viz="play" data-i18n-aria-label="player.play" aria-label="Play music"><svg class="viz-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><svg class="viz-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg></button>
        <button class="control-button" type="button" data-viz="next" data-i18n-aria-label="player.next" aria-label="Next song"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5h2v14h-2zM5 5l11 7L5 19z"/></svg></button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script id="track-data" type="application/json">__TRACK_DATA__</script>
  <script id="i18n-data" type="application/json">__I18N_DATA__</script>
  <script src="assets/js/i18n.js" defer></script>
  <script src="assets/js/player.js" defer></script>
  <script src="assets/js/motion.js" defer></script>
  <script src="assets/js/features.js" defer></script>
  __ANALYTICS__
</body>
</html>
