<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#100d1c">
  <meta name="description" content="__DESCRIPTION__" data-i18n-content="meta.description">
  <title data-i18n="meta.title">__NAME__ | Music &amp; Links</title>
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <main class="site-shell">
    <div class="site-toolbar">
      <div class="language-control">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 7h14M5 17h14"/></svg>
        <label for="language-select" data-i18n="language.label">Language</label>
        <select id="language-select" name="language" data-i18n-aria-label="language.label" aria-label="Language">__LANGUAGE_OPTIONS__</select>
      </div>
    </div>
    <header class="hero">
      <div class="avatar">__PROFILE__</div>
      <p class="eyebrow" data-i18n="site.eyebrow">Music &amp; connections</p>
      <h1>__NAME__</h1>
      <p class="hero-subtitle" data-i18n="content.tagline">__TAGLINE__</p>
    </header>
    <div class="sections-grid">__SECTIONS__</div>
    <footer class="site-footer" data-i18n="site.footer">__NAME__ &middot; Music &amp; links</footer>
  </main>
  <p id="language-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  <div id="player-dock" class="player-dock">
    <section id="playlist-panel" class="playlist-panel glass" aria-labelledby="playlist-heading" hidden>
      <div class="playlist-heading">
        <h2 id="playlist-heading" data-i18n="player.queueHeading">Your next listen</h2>
        <button id="close-queue" class="close-queue" type="button" data-i18n-aria-label="player.closeQueue" aria-label="Close playlist">&times;</button>
      </div>
      <div id="playlist-items" class="playlist-items"></div>
    </section>
    <section id="music-player" class="music-player glass" data-i18n-aria-label="player.heading" aria-label="Music player">
      <div class="player-grid">
        <div class="cd" aria-hidden="true">
          <img id="cd-cover" class="cd-cover" src="__FIRST_COVER__" alt="" width="62" height="62">
        </div>
        <div class="player-info">
          <div class="player-topline">
            <p id="playing-label" class="playing-label">Ready to play</p>
            <button id="queue-toggle" class="queue-toggle" type="button" data-i18n-aria-label="player.openQueue" aria-label="Open playlist" aria-controls="playlist-panel" aria-expanded="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h11"/></svg>
              <span id="queue-count">4 songs</span>
            </button>
          </div>
          <p id="track-title" class="track-title">__FIRST_TITLE__</p>
          <p id="track-artist" class="track-artist">__NAME__</p>
          <canvas id="waveform" class="waveform" aria-hidden="true"></canvas>
        </div>
        <div class="player-controls">
          <button id="previous-button" class="control-button" type="button" data-i18n-aria-label="player.previous" aria-label="Previous song">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h2v14H5zm14 0v14L8 12z"/></svg>
          </button>
          <button id="play-button" class="control-button play-button" type="button" aria-label="Play music" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button id="next-button" class="control-button" type="button" data-i18n-aria-label="player.next" aria-label="Next song">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5h2v14h-2zM5 5l11 7L5 19z"/></svg>
          </button>
        </div>
      </div>
      <div class="player-bottom">
        <div class="timeline">
          <span id="elapsed" class="clock">0:00</span>
          <input id="seek" class="seek" type="range" min="0" max="1000" step="1" value="0" data-i18n-aria-label="player.position" aria-label="Song position" disabled>
          <span id="duration" class="clock">0:00</span>
        </div>
        <div class="volume-controls">
          <button id="mute-button" class="mute-button" type="button" aria-label="Mute music" aria-pressed="false"></button>
          <input id="volume" class="volume" type="range" min="0" max="1" step="0.01" value="0.45" data-i18n-aria-label="player.volume" aria-label="Music volume">
        </div>
      </div>
      <p id="player-status" class="player-status" role="status" aria-live="polite"></p>
      <audio id="music-audio" preload="metadata"></audio>
    </section>
  </div>
  <script id="track-data" type="application/json">__TRACK_DATA__</script>
  <script id="i18n-data" type="application/json">__I18N_DATA__</script>
  <script src="assets/js/i18n.js" defer></script>
  <script src="assets/js/player.js" defer></script>
</body>
</html>
